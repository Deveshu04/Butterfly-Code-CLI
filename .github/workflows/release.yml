name: Release

# Push a tag like v0.1.0 (it must match the package versions; see
# scripts/release/bump.ts). Required secret: NPM_TOKEN (an npm automation
# token). Optional: TAP_GITHUB_TOKEN, a token that can push to
# Deveshu04/homebrew-tap and Deveshu04/scoop-bucket.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: darwin-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/third-party.ts
      - run: bun scripts/build-exe.ts
      - run: bun scripts/smoke-exe.ts
      - run: bun scripts/release/package.ts
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/release/
            dist/npm/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - run: bun scripts/release/third-party.ts
      - run: bun scripts/release/finalize.ts

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/npm/butterfly-code-*/; do
            (cd "$dir" && npm publish --access public --provenance)
          done
          (cd dist/npm/butterfly-code && npm publish --access public --provenance)

      - name: Update Homebrew tap and Scoop bucket
        if: env.TAP_TOKEN != ''
        run: |
          set -e
          git config --global user.name "butterfly-release"
          git config --global user.email "butterfly-release@users.noreply.github.com"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Deveshu04/homebrew-tap.git" tap
          mkdir -p tap/Formula && cp dist/homebrew/butterfly-code.rb tap/Formula/
          (cd tap && git add -A && git commit -m "butterfly-code ${GITHUB_REF_NAME}" && git push)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Deveshu04/scoop-bucket.git" bucket
          mkdir -p bucket/bucket && cp dist/scoop/butterfly-code.json bucket/bucket/
          (cd bucket && git add -A && git commit -m "butterfly-code ${GITHUB_REF_NAME}" && git push)
